name: Linux x64

# Linux 门要编整套 src + X11 桥，空跑一次 20 分钟起。所以只在这条门真正依赖的
# 输入变动时触发：src / cpp-src/x11 / probes/linux_x11 / 本文件。
# 参考 Qt、GTK、wxWidgets 的 GUI CI：push 只跟 main，PR 同样带 paths 过滤 ——
# 只改 README 的 PR 不该占一台 4 核 runner 半小时。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cpp-src/x11/**'
      - 'cpp-src/skia/**'
      - 'probes/linux_x11/**'
      - '.github/workflows/linux-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'cpp-src/x11/**'
      - 'cpp-src/skia/**'
      - 'probes/linux_x11/**'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:
    inputs:
      skia_run_id:
        description: '指定 Linux Skia build-only run id；留空则取最近一次成功构建'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  x11-e2e:
    name: X11Platform e2e (PHP ${{ matrix.php }} ZTS / tpc v0.10)
    # ★ 不用 ubuntu-22.04：它的 GCC 11.2 与本地开发（GCC 13.3）差两个大版本，
    #   本地能过的告警/警告升级在 CI 上表现不同，等于量的是另一个编译器；
    #   而且 22.04 镜像已进入弃用期，随时会被强制迁移。24.04 是 GCC 13.2，
    #   与本地同代，只差补丁号。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 与 Windows / verify 同口径：桥本身不绑 PHP 版本，但 AOT 的可达性绑 ZendVM ABI，
    # 两腿都要证。fail-fast: false 保证 8.4 绿不掩盖 8.5 红。
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      PHPX_HOME: ${{ github.workspace }}/third_party/phpx
      TPC: ${{ github.workspace }}/third_party/typephp/bin/tpc.php
    steps:
      - uses: actions/checkout@v4

      # 官方 swoole 源，不用 fork：本地验证过的两个 commit 都在官方仓库里，
      # 其中 90e6d22 就是官方 phpx 的 master HEAD。ref 不动，只换 owner，零行为漂移。
      - name: Checkout pinned TypePHP
        uses: actions/checkout@v4
        with:
          repository: swoole/typephp
          ref: c5599c5c9e8597e7124dd79db94739cabe39c526
          path: third_party/typephp

      - name: Checkout pinned PHPX
        uses: actions/checkout@v4
        with:
          repository: swoole/phpx
          ref: 90e6d22a9c3f4d5dbd2c75d62e90bf5adfe58c89
          path: third_party/phpx

      - name: Setup PHP ${{ matrix.php }} ZTS
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true
          phpts: ts
          update: true

      - name: Verify ZTS and embed library
        shell: bash
        run: |
          php -r 'if (!PHP_ZTS) { fwrite(STDERR, "Expected ZTS PHP\n"); exit(1); }'
          php -r 'if (!str_starts_with(PHP_VERSION, "${{ matrix.php }}.")) { fwrite(STDERR, "Expected PHP ${{ matrix.php }}.x, got " . PHP_VERSION . "\n"); exit(1); }'
          php_home="$(php-config --prefix)"
          test -x "${php_home}/bin/php-config"
          test -f "${php_home}/lib/libphp.so"
          echo "PHP_HOME=${php_home}" >> "${GITHUB_ENV}"

      # 与 TypePHP 官方 .github/actions/patch-php-headers 同款，patch 取自同一个 pinned commit。
      - name: Patch php_hash.h for C++
        shell: bash
        run: |
          include_dir="$(php-config --include-dir)"
          if grep -Fq 'char *base = ecalloc(' "${include_dir}/ext/hash/php_hash.h"; then
            curl -fsSL https://raw.githubusercontent.com/swoole/typephp/c5599c5c9e8597e7124dd79db94739cabe39c526/.github/patches/php-hash-cxx.patch \
              | sudo patch --directory="${include_dir}" --strip=1
          fi

      # ★ 24.04 上这一步要盯三件事，任何一件失手都会挂 8 分钟以上：
      #   ① `--no-install-recommends`：不加的话 apt 会拉 67.3 MB / 44 个包，其中
      #      ghostscript(libgs10)、feh、menu、yudit-common、poppler-data 全是 fluxbox 的
      #      recommends，跟窗口门毫无关系（实测单个 176 kB 的包在镜像上卡了 3 分 13 秒）。
      #   ② apt 的默认 acquire 超时太长：镜像一抖就干等，加 Retries + 短超时让坏连接重连。
      #   ③ 24.04 镜像自带 needrestart，且这里顺带升级 libc6 ⇒ 会弹交互式对话框。
      #      sudo 会清环境变量，而 runner 的 sudoers 未必允许 `-E`，所以用 `sudo env VAR=..`。
      #   外面再包 timeout：apt 卡住要变成明确失败，不是静默烧到 job 的 45 分钟上限。
      - name: Install native dependencies
        run: |
          APT_ENV="DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a NEEDRESTART_SUSPEND=1"
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dpkg::Options::=--force-confold"
          if ! timeout 240 sudo env $APT_ENV apt-get update $APT_OPTS; then
            echo "::error title=apt-get update 超时/失败::apt 在 4 分钟内没跑完，看上面的输出"
            exit 1
          fi
          # fluxbox：X11 端到端门要真窗口。裸 Xvfb 无窗口管理器，窗口不会 map/expose，
          # Qt 官方 GUI CI 配方同样是 Xvfb + fluxbox（"proper focus and window management"）。
          # gdb 只用来在卡死时抓一次 C++ 栈。fonts-dejavu-core 是 fluxbox 的兜底字体：
          # 关掉 recommends 后树里一个 fonts-* 都不剩，fluxbox 会因找不到字形退出。
          # libfontconfig1 是运行时库：Skia 的 libskia.a 引用 Fc* 符号，build.sh
          # 会从它现场建 libfontconfig.so 软链给 linker；这里不需要 -dev 头。
          # xclip：剪贴板端到端门的 owner（headless 无 clipboard manager，xclip fork
          # 常驻进程顶上；它的独立 connection 也让我们的同步 readText 不会自死锁）。
          # yad：dialog/tray 的原生助手（门里用确定性假进程验接线，真桌面用 yad 弹窗/图标）。
          if ! timeout 600 sudo env $APT_ENV apt-get install --yes --no-install-recommends $APT_OPTS \
              build-essential cmake libgmp-dev libmpfr-dev pkg-config python3-dev \
              libfontconfig1 xvfb x11-utils fluxbox fonts-dejavu-core gdb xclip yad; then
            echo "::error title=apt-get install 超时/失败::依赖装不上，后面所有步骤都无意义"
            exit 1
          fi
          # runner 默认 ptrace_scope=1 会拒绝对非后代进程 attach（应用是 timeout 的子进程，
          # 不是 gdb 的后代）⇒ 放开，否则 gdb.log 永远是空的。
          sudo sysctl -w kernel.yama.ptrace_scope=0 || true

      - name: Install compiler dependencies
        run: composer install --working-dir=third_party/typephp --prefer-dist --no-progress

      - name: Build PHPX
        shell: bash
        run: |
          cmake -S "${PHPX_HOME}" -B "${PHPX_HOME}/build" \
            -D CMAKE_BUILD_TYPE=Release -D BUILD_TESTS=OFF -D BUILD_EXT=OFF -D GITHUB_ACTION=ON \
            -D php_dir="${PHP_HOME}"
          cmake --build "${PHPX_HOME}/build" --target phpx --parallel "$(nproc)"
          test -f "${PHPX_HOME}/lib/libphpx.so"
          echo "LD_LIBRARY_PATH=${PHPX_HOME}/lib:${PHP_HOME}/lib" >> "${GITHUB_ENV}"

      # ★ 不用 sleep 猜就绪：runner 冷启动时 Xvfb 可能 3s 还没 bind，热节点上 1s 就绪，
      #   固定 sleep 要么白等要么偶发失败。改为轮询真实判据（X 能应答 / WM 已注册）。
      - name: Start Xvfb + window manager
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 &
          # ★ GITHUB_ENV 只对**后续 step** 生效，本 step 里起的进程读不到。
          #   之前 fluxbox 就是这样拿到空 DISPLAY 直接退出（"Couldn't connect to
          #   XServer passing null display"），而它退出没人检查 ⇒ "加了窗口管理器"
          #   的对照实验从来没成立过。本 step 用 export，后续 step 用 GITHUB_ENV。
          export DISPLAY=:99
          echo "DISPLAY=:99" >> "${GITHUB_ENV}"

          ready=0
          for _ in $(seq 1 50); do
            if xwininfo -root -display :99 > /dev/null 2>&1; then ready=1; break; fi
            sleep 0.2
          done
          if [ "${ready}" -ne 1 ]; then
            echo "::error title=Xvfb 未就绪::Xvfb :99 在 10s 内没有应答，看 xvfb.log"
            cat /tmp/xvfb.log >&2
            exit 1
          fi

          # 窗口管理器负责 map/焦点/自动定位；缺它时窗口停在 withdrawn、
          # XSendEvent 打得出去但应用等不到 expose，表现为 90s 卡死。
          fluxbox > /tmp/fluxbox.log 2>&1 &
          wm_pid=$!
          wm_ready=0
          for _ in $(seq 1 50); do
            if xprop -root -display :99 _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q 'window id'; then
              wm_ready=1; break
            fi
            kill -0 "${wm_pid}" 2>/dev/null || break
            sleep 0.2
          done
          if [ "${wm_ready}" -ne 1 ]; then
            echo "::error title=窗口管理器未注册::fluxbox 没能在 root 上挂 _NET_SUPPORTING_WM_CHECK，窗口不会 map"
            cat /tmp/fluxbox.log >&2
            exit 1
          fi

      # Skia 包由 linux-deps.yml 的 build-only run 产出；这里只消费，不重新编。
      # 用 gh（runner 自带）+ GITHUB_TOKEN 取最近一次成功 artifact，避免把 run id
      # 硬编码进仓库（换一次构建就失效）。artifact 过期就响亮失败，不能静默
      # 退回软光栅 —— 否则这条门会在"Skia 根本没链上"时全绿。
      - name: Download Linux Skia artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ inputs.skia_run_id }}"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow linux-deps.yml \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error title=No Skia artifact::找不到成功的 linux-deps.yml run，请先在 Actions 构建 Linux Skia"
            exit 1
          fi
          echo "Using Skia build run ${run_id}"
          dest="${RUNNER_TEMP}/drift-skia"
          mkdir -p "$dest"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir "$dest"
          skia_home=""
          for d in "$dest"/*; do
            if [ -f "$d/out/Release-x64/libskia.a" ]; then skia_home="$d"; break; fi
          done
          if [ -z "$skia_home" ]; then
            echo "::error title=Bad Skia artifact::下载的 artifact 里没有 out/Release-x64/libskia.a"
            exit 1
          fi
          echo "DRIFT_SKIA_HOME=${skia_home}" >> "${GITHUB_ENV}"

      # 结构判据由 verify.yml 统一跑（这里再跑一遍只是同一判据的第二次执行，
      # 失败信息还得去另一个 job 看）。Linux 门只负责真编译 + 真窗口。
      - name: X11 end-to-end gate
        shell: bash
        env:
          # ★ 不能提到 job 级 env：`runner` 上下文在 job 级 env 里不可用，
          #   GitHub 会整份判为"无效工作流"（第 47 行报 unrecognized named-value）。
          #   编译与运行产物都落在这里；失败时整目录上传，本地能一模一样复现。
          X11_WS: ${{ runner.temp }}/drift-linux-x11-verify
          # 卡到一半时抓一次 C++ 栈：utime 只能说"在烧 CPU"，栈才能说"烧在哪"。
          DRIFT_X11_GDB: '1'
        run: |
          # 步骤被取消或提前退出时不留孤儿进程：残留的 linux_x11_e2e 会一直占着
          # DISPLAY 和 CPU，后面的日志上传与 runner 回收都跟着变慢。
          # 按名字匹配（不是全路径）：应用是以 `./linux_x11_e2e` 起的，cmdline 里
          # 没有工作区前缀，用 "${X11_WS}/linux_x11_e2e" 会一条都匹不上。
          cleanup() { pkill -f 'linux_x11_e2e' || true; }
          trap cleanup EXIT
          bash probes/linux_x11/build.sh "${X11_WS}"

      # ★ 失败必须留现场：以前只有 job 日志，日志里没有 build.log / run.log /
      #   watch.log 的内核态采样，失败后只能靠猜。这里先就地打印关键尾巴，
      #   再整目录上传，本地下载下来能直接 grep。
      - name: Dump X11 failure context
        if: failure()
        shell: bash
        env:
          X11_WS: ${{ runner.temp }}/drift-linux-x11-verify
        run: |
          for f in "${X11_WS}/build.log" "${X11_WS}/run.log" "${X11_WS}/watch.log" "${X11_WS}/gdb.log" /tmp/xvfb.log /tmp/fluxbox.log; do
            echo "──── ${f} ────"
            if [ -f "${f}" ]; then tail -60 "${f}"; else echo "(缺失)"; fi
          done
          echo "──── 当前窗口树 ────"
          xwininfo -root -tree -display "${DISPLAY:-:99}" 2>&1 | head -40 || true
          echo "──── 残留进程 ────"
          pgrep -af 'linux_x11_e2e|Xvfb|fluxbox' || true

      - name: Upload X11 failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # 双矩阵下两腿可能同时失败；名字带版本，避免互相覆盖成同一份日志。
          name: linux-x11-failure-logs-php${{ matrix.php }}
          path: |
            ${{ runner.temp }}/drift-linux-x11-verify/*.log
            ${{ runner.temp }}/drift-linux-x11-verify/project.yml
            /tmp/xvfb.log
            /tmp/fluxbox.log
          if-no-files-found: ignore
          retention-days: 7
