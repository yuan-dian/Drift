# Package release. Runs on v* tags.
#
# Order is load-bearing: build Skia first, then verify/AOT consume that artifact.
# The product tag never waits on a public deps asset; publish stays in windows-deps.
#
# The release is created as a DRAFT so a stray tag cannot announce a release
# before a human has reviewed the notes and assets.

name: Package release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

concurrency:
  group: product-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Skia 必须先就绪；产物通过 artifact 交给 verify 与 windows-build。
  deps:
    name: Build Skia dependencies
    uses: ./.github/workflows/windows-deps.yml
    permissions:
      contents: write
    with:
      skia_revision: ''
      publish: false
      commit_lock: false

  verify:
    name: Verify and draft release
    needs: deps
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, gd, curl, zip
          tools: composer:v2
        env:
          fail-fast: true
          update: true

      - name: Verify PHP version
        shell: bash
        run: |
          case "$(php -r 'echo PHP_VERSION;')" in
            "8.4"*) ;;
            *) echo "::error::setup-php installed an unexpected PHP version" >&2; exit 1 ;;
          esac

      # PHPUnit 不在仓库里（`/vendor/` 被 .gitignore 排除）；用入库的
      # composer.lock 装，否则 verify 的 unit / feature step 起不来。
      - name: Install PHPUnit (pinned by composer.lock)
        shell: bash
        run: composer install --prefer-dist --no-progress

      # 发版前跑全量；版本锚点由 static/version 与 static/genversion 覆盖，
      # 不再在 workflow 里另起一份版本命令。
      - name: Version anchors and full verify
        shell: bash
        run: |
          set -o pipefail
          php bin/drift verify --full --json | tee verify-report.json

      # 发版闸门不许靠没测到洗绿：unit / feature 没跑到就不该创建 draft release。
      - name: Assert full gate really ran (unit / feature)
        shell: bash
        run: php .github/scripts/assert-verify-report.php verify-report.json unit feature

      # deps job 已按当前 SKIA_REVISION 编好 Skia；覆盖 checkout 里的旧 lock/zip。
      - name: Restore Skia artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.deps.outputs.artifact_name }}
          path: .

      - name: Resolve deps package from DEPS_VERSION
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php tools/fetch-deps.php --force

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it untouched."
          else
            gh release create "$TAG" --draft --verify-tag --title "Drift $TAG" --generate-notes
          fi

  # 复用 windows-build.yml 的同一份公开工具链：编出 dev.exe 并随这个 tag 的 draft release 上传。
  # needs: verify 保证 draft 已存在；资产名固定，文档可用 latest/download 直链。
  dev-shell:
    name: Build and publish dev shell
    needs: [verify, deps]
    uses: ./.github/workflows/windows-build.yml
    with:
      target: dev
      release_tag: ${{ github.ref_name }}
      deps_artifact: ${{ needs.deps.outputs.artifact_name }}
    permissions:
      contents: write
