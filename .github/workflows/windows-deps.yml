# Builds drift-deps-win-x64.zip from a pinned Skia commit.
#
# Two paths, one recipe:
#   - push main / DEPS_VERSION: rebuild and publish deps-vN, then commit the lock.
#   - workflow_call from a product release: build first, hand the package to
#     verify/AOT via artifact; the product tag never waits on a public asset.
#
# Path filter is DEPS_VERSION only. The lock commit does not retrigger this flow.
# Order is load-bearing: pack writes deps.lock.json -> commit -> tag -> release.
# The tag must point at the commit containing the new lock, otherwise a clean
# clone verifies the new asset against the old lock and fails.
#
# Runs on a hosted runner on purpose. The earlier self-hosted variant silently
# queued forever on a repo with no registered runner — a build channel that
# exists in YAML but never executes. Everything the build needs is therefore
# either on the image (VS / Win SDK / LLVM), fetched here (depot_tools), or
# committed (cpp/fonts).

name: Windows x64 deps

on:
  push:
    branches: [main]
    paths: [DEPS_VERSION]
  workflow_dispatch:
    inputs:
      skia_revision:
        description: 'Skia commit (40-hex); empty means read SKIA_REVISION'
        required: false
        default: ''
        type: string
      fonts_dir:
        description: 'Optional directory holding NotoSansSC-*.ttf (overrides the committed fonts)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Commit lock, tag DEPS_VERSION and upload Release assets'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      skia_revision:
        description: 'Skia commit (40-hex); empty means read SKIA_REVISION'
        required: false
        default: ''
        type: string
      fonts_dir:
        description: 'Optional directory holding NotoSansSC-*.ttf'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish the package to the DEPS_VERSION release'
        required: false
        default: false
        type: boolean
      commit_lock:
        description: 'Commit lock and advance DEPS_VERSION (false for product releases)'
        required: false
        default: true
        type: boolean
    outputs:
      artifact_name:
        description: Artifact holding zip / sha256 / deps.lock.json
        value: ${{ jobs.build.outputs.artifact_name }}
      deps_tag:
        description: DEPS_VERSION used for this build
        value: ${{ jobs.build.outputs.deps_tag }}
      sha256:
        description: SHA256 of the built package
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  PHP_VERSION: '8.4'

concurrency:
  group: deps-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build deps (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 330
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      deps_tag: ${{ steps.resolve.outputs.deps_tag }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          rev='${{ inputs.skia_revision }}'
          if [ -z "$rev" ]; then rev="$(tr -d '\r\n' < SKIA_REVISION)"; fi
          if [[ ! "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Skia revision must be a 40-hex commit; got '$rev' (unpinned cannot be built)"
            exit 1
          fi
          printf '%s\n' "$rev" > SKIA_REVISION
          tag="$(tr -d '\r\n' < DEPS_VERSION)"
          if [[ ! "$tag" =~ ^deps-v[0-9]+$ ]]; then
            echo "::error::DEPS_VERSION must look like deps-vN; got '$tag'"
            exit 1
          fi
          publish=false
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            publish=true
          fi
          commit_lock=true
          if [ "${{ github.event_name }}" = "workflow_call" ] && [ "${{ inputs.commit_lock }}" = "false" ]; then
            commit_lock=false
          fi
          printf 'REV=%s\nTAG=%s\nPUBLISH=%s\nCOMMIT_LOCK=%s\n' "$rev" "$tag" "$publish" "$commit_lock" >> "$GITHUB_ENV"
          printf 'rev=%s\n' "$rev" >> "$GITHUB_OUTPUT"
          printf 'deps_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=drift-deps-%s-%s\n' "${{ github.run_id }}" "${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "Skia=$rev  Deps=$tag  publish=$publish  commit_lock=$commit_lock"

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, zip, mbstring
          coverage: none

      - name: Assert PHP extensions
        shell: bash
        run: |
          php -r 'foreach (["curl", "zip"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing PHP extension: $e\n"); exit(1); } }'

      # 托管镜像只剩十几 GB 可用，而 git-sync-deps + 全量编译要吃掉十几 GB。
      # 先删掉本次构建用不到的大件（Android SDK / 预装浏览器 / 多版本 JDK、node、Ruby），
      # 保留 LLVM、VS、Win SDK、Python、dotnet —— 那几样要么构建要用，要么与 runner 自身相关。
      - name: Free disk space
        shell: pwsh
        run: |
          $targets = @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\ProgramData\Microsoft\Android',
            'C:\Program Files\Microsoft SDKs\Azure',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files (x86)\Google',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files (x86)\Microsoft\Edge',
            'C:\Program Files\Microsoft\Edge'
          )
          $targets += (Get-ChildItem 'C:\hostedtoolcache\windows' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'Java_*' -or $_.Name -like 'node-*' -or $_.Name -like 'Ruby*' } |
            Select-Object -ExpandProperty FullName)
          foreach ($p in $targets) {
            if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          $free = (Get-PSDrive C).Free / 1GB
          Write-Host ("C: free after cleanup = {0:N1} GB" -f $free)

      # 空间不够就别开始：Skia 全量编译爆盘时会给出一个和磁盘无关的编译错误，
      # 看起来像代码问题。这里提前拦，报的是真实原因。
      - name: Assert disk headroom
        shell: pwsh
        run: |
          $free = (Get-PSDrive C).Free / 1GB
          if ($free -lt 18) { throw ("only {0:N1} GB free; a full Skia build needs ~20 GB" -f $free) }
          Write-Host ("disk headroom ok: {0:N1} GB" -f $free)

      # depot_tools 提供 gn / ninja；缓存命中时 gn 已 bootstrap 过，省掉首次下载。
      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/depot_tools
          key: depot_tools-${{ runner.os }}-v1

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/depot_tools"
          if [ ! -d "$deps/.git" ]; then
            git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$deps"
          fi
          echo "$deps" >> "$GITHUB_PATH"
          # SKIA_GN / SKIA_NINJA / SKIA_PYTHON 由下一步（bootstrap 之后）定，
          # 那时才知道 CIPD 把 gn.exe 铺在哪个子目录里。

      # ★ 必须 bootstrap：clone 下来的 depot_tools 只有一个 shell 包装，
      #   gn.bat / vpython3 / cipd 都只是转发脚本。缺 python3_bin_reldir.txt 时它们
      #   一律直接退出（"need to initialize depot_tools"）；缺 gn.exe 时又是另一句
      #   "Unable to find gn in your $PATH"。两种都发生在 Skia 已经 sync 完之后，
      #   看着像编译错。
      # ★ bootstrap 把 CIPD 装的 python3 / gn / ninja 铺在 depot_tools\bootstrap-<hash>\，
      #   并且只在它自己那个 cmd 进程里 prepend 了 PATH —— 子进程一退，父进程看不到。
      #   所以这里必须按 python3_bin_reldir.txt（bootstrap 自己写的权威指针）再补一次，
      #   否则同一个步骤里 gn.bat → gn.py 立刻报 "Unable to find gn in your $PATH"。
      # ★ GITHUB_PATH 只对后续步骤生效，当前步骤的 PATH 得自己改。
      - name: Bootstrap depot_tools
        shell: pwsh
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'depot_tools'
          $env:PATH = "$deps;$env:PATH"

          $bootstrap = Join-Path $deps 'bootstrap\bootstrap.bat'
          if (Test-Path $bootstrap) {
            & $bootstrap
            if ($LASTEXITCODE -ne 0) { throw 'depot_tools bootstrap failed' }
          } else {
            & (Join-Path $deps 'update_depot_tools.bat')
            if ($LASTEXITCODE -ne 0) { throw 'update_depot_tools failed' }
          }

          $relFile = Join-Path $deps 'python3_bin_reldir.txt'
          if (-not (Test-Path $relFile)) {
            throw 'depot_tools still unbootstrapped: python3_bin_reldir.txt missing'
          }
          $bootRoot = (Get-Content $relFile -Raw).Trim()
          if ($bootRoot -and -not [System.IO.Path]::IsPathRooted($bootRoot)) {
            $bootRoot = Join-Path $deps $bootRoot
          }
          if (-not $bootRoot -or -not (Test-Path $bootRoot)) {
            $bootRoot = Get-ChildItem $deps -Directory -Filter 'bootstrap-*' |
              Sort-Object Name | Select-Object -Last 1 -ExpandProperty FullName
          }
          if (-not $bootRoot) { throw 'depot_tools CIPD bootstrap dir not found' }
          Write-Host "CIPD bootstrap dir: $bootRoot"

          # gn / ninja 是硬需求；CIPD 的 python 在 Windows 上可能叫 python3.exe 也可能叫
          # python.exe，两种都认。找到的可执行文件可能在 bootstrap 目录的子目录里，
          # 所以按"文件实际所在目录"补 PATH，而不是只补 bootRoot。
          $dirs = [System.Collections.Generic.List[string]]::new()
          $dirs.Add($bootRoot)
          $found = @{}
          foreach ($name in 'gn.exe', 'ninja.exe') {
            $hit = Get-ChildItem $bootRoot -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $hit) { throw "$name missing from $bootRoot — depot_tools CIPD bootstrap is incomplete" }
            & $hit.FullName --version
            if ($LASTEXITCODE -ne 0) { throw "$name is not runnable: $($hit.FullName)" }
            $found[$name] = $hit.Name
            $dirs.Add($hit.DirectoryName)
          }
          $py = @('python3.exe', 'python.exe') |
            ForEach-Object { Get-ChildItem $bootRoot -Recurse -Filter $_ -File -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $py) { throw "no python under $bootRoot — depot_tools CIPD bootstrap is incomplete" }
          & $py.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "python is not runnable: $($py.Name)" }
          $dirs.Add($py.DirectoryName)

          $extra = ($dirs | Select-Object -Unique) -join ';'
          $env:PATH = "$extra;$env:PATH"
          # GITHUB_PATH 是每行一条，不能把多条拼成一行。
          $dirs | Select-Object -Unique | Add-Content -Path $env:GITHUB_PATH

          Add-Content -Path $env:GITHUB_ENV -Value "SKIA_GN=$($found['gn.exe'])"
          Add-Content -Path $env:GITHUB_ENV -Value "SKIA_NINJA=$($found['ninja.exe'])"
          Add-Content -Path $env:GITHUB_ENV -Value "SKIA_PYTHON=$($py.Name)"

      # 镜像自带 VS / Win SDK / LLVM，但目录名随镜像更新漂移，不能写死；
      # vars.* 保留覆盖能力。GN 字符串里反斜杠是转义符，路径必须转正斜杠。
      - name: Resolve MSVC / SDK / LLVM
        shell: pwsh
        run: |
          $vc = '${{ vars.SKIA_WIN_VC }}'
          if (-not $vc) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found on this image' }
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw 'no Visual Studio installation with VC tools' }
            $vc = Join-Path $vs 'VC'
          }

          $sdk = '${{ vars.SKIA_WIN_SDK }}'
          if (-not $sdk) { $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10' }
          $sdkVersion = '${{ vars.SKIA_WIN_SDK_VERSION }}'
          if (-not $sdkVersion) {
            $include = Join-Path $sdk 'Include'
            if (-not (Test-Path $include)) { throw "Windows SDK include dir missing: $include" }
            $sdkVersion = (Get-ChildItem $include -Directory | Sort-Object Name | Select-Object -Last 1).Name
          }

          $llvm = '${{ vars.SKIA_CLANG_WIN }}'
          if (-not $llvm) { $llvm = Join-Path $env:ProgramFiles 'LLVM' }

          $vc = $vc -replace '\\', '/'
          $sdk = $sdk -replace '\\', '/'
          $llvm = $llvm -replace '\\', '/'
          foreach ($p in @($vc, $sdk, $llvm)) {
            if (-not (Test-Path $p)) { throw "toolchain path missing: $p" }
          }
          if (-not (Test-Path (Join-Path $llvm 'bin\clang-cl.exe'))) {
            throw "clang-cl.exe missing under $llvm"
          }

          "SKIA_WIN_VC=$vc" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SKIA_WIN_SDK=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SKIA_WIN_SDK_VERSION=$sdkVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SKIA_CLANG_WIN=$llvm" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VC=$vc  SDK=$sdk/$sdkVersion  LLVM=$llvm"

      - name: Ensure fonts are present
        shell: bash
        run: |
          fonts='${{ inputs.fonts_dir }}'
          if [ -n "$fonts" ]; then
            mkdir -p cpp/fonts
            cp -R "$fonts"/*.ttf cpp/fonts/
          fi
          for f in NotoSansSC-Regular.ttf NotoSansSC-Bold.ttf; do
            test -f "cpp/fonts/$f" || { echo "::error::cpp/fonts/$f missing — fonts are committed; check the .gitignore allowlist or pass fonts_dir"; exit 1; }
          done

      - name: Build Skia from pinned commit
        shell: bash
        run: bash tools/skia/build-skia.sh --rev="$REV" --out="$PWD/cpp/skia" --replace

      # 本 workflow 的产物是 Skia 依赖包，只跑 `verify --layer=static`（零依赖静态层），
      # 不启动 PHPUnit —— 也就没有「没测到被算通过」的形状。
      - name: Install PHPUnit (pinned by composer.lock)
        shell: bash
        run: |
          if command -v composer >/dev/null 2>&1; then
            composer install --prefer-dist --no-progress
          else
            echo "::notice::composer unavailable on this runner; only the static layer runs"
          fi

      - name: Pack and verify
        shell: bash
        run: |
          set -o pipefail
          php tools/pack-deps.php
          php tools/sync-lock-anchors.php
          php bin/drift verify --layer=static --json | tee verify-report.json
          php .github/scripts/assert-verify-report.php verify-report.json

      - name: Refresh package outputs
        id: package
        shell: bash
        run: |
          sha="$(php -r '$j=json_decode((string) file_get_contents("deps.lock.json"), true); echo $j["sha256"] ?? "";')"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::pack-deps produced no SHA256"; exit 1; }
          printf 'sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.artifact_name }}
          path: |
            dist/drift-deps-win-x64.zip
            dist/drift-deps-win-x64.zip.sha256
            deps.lock.json
            README.md
          if-no-files-found: error
          retention-days: 14

      # 必须在写远端之前拦：tag 已存在时下面的 git tag 会失败，而 lock 的 commit
      # 已经 push 出去，留一个没有 release 的孤儿提交。
      - name: Preflight deps tag is unused
        if: ${{ env.PUBLISH == 'true' && env.COMMIT_LOCK == 'true' }}
        shell: bash
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists; bump DEPS_VERSION before publishing a new package"
            exit 1
          fi

      - name: Commit lock and push
        if: ${{ env.PUBLISH == 'true' && env.COMMIT_LOCK == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKIA_REVISION deps.lock.json README.md
          if git diff --cached --quiet; then
            echo "::error::pack-deps produced no lock change; nothing to publish"
            exit 1
          fi
          git commit -m "chore(deps): rebuild Skia at ${REV:0:12} for $TAG"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Tag deps version
        if: ${{ env.PUBLISH == 'true' && env.COMMIT_LOCK == 'true' }}
        shell: bash
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish deps release
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: php tools/release-deps.php --token="$TOKEN" --force

      - name: Verify from published assets
        if: ${{ env.PUBLISH == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php tools/fetch-deps.php --tag="$TAG" --force

      - name: Dry-run summary
        if: ${{ env.PUBLISH != 'true' }}
        shell: bash
        run: echo "Package built and verified as an artifact; publish=false so no commit/tag/release was written."
