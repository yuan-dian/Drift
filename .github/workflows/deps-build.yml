# Builds drift-deps-win-x64.zip from a pinned Skia commit.
#
# Deliberately NOT triggered by a product release: fetch-deps.php looks for a fixed
# asset name on the DEPS_VERSION tag. Publishing to v* would 404 for every consumer
# and would rebuild a multi-hour dependency on every code release.
#
# Order is load-bearing: pack writes deps.lock.json -> commit -> tag -> release.
# The tag must point at the commit containing the new lock, otherwise a clean clone
# verifies the new asset against the old lock and fails.
#
# Enable a push trigger only once a self-hosted Windows runner is registered and
# the package has been published at least once:
#   push:
#     branches: [main]
#     paths: [SKIA_REVISION, DEPS_VERSION, tools/skia/**, tools/pack-deps.php]

name: Deps build

on:
  workflow_dispatch:
    inputs:
      skia_revision:
        description: 'Skia commit (40-hex); SKIA_REVISION "unpinned" cannot be built'
        required: true
        type: string
      fonts_dir:
        description: 'Optional directory holding NotoSansSC-*.ttf (runner keeps cpp/fonts otherwise)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Commit lock, tag DEPS_VERSION and upload Release assets'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

concurrency:
  group: deps-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build deps (self-hosted Windows)
    runs-on: [self-hosted, windows]
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      REV: ${{ inputs.skia_revision }}
      FONTS_DIR: ${{ inputs.fonts_dir }}
    steps:
      # clean:false keeps cpp/fonts on the persistent self-hosted workspace.
      # Fonts are not in git and do not change with Skia; cpp/skia is rebuilt below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Pin Skia revision
        shell: bash
        run: |
          printf '%s\n' "$REV" > SKIA_REVISION
          php -r '$r=trim(file_get_contents("SKIA_REVISION")); if (!preg_match("/^[0-9a-f]{40}$/",$r)) { fwrite(STDERR,"SKIA_REVISION must be 40-hex\n"); exit(1); }'

      - name: Ensure fonts are present
        shell: bash
        run: |
          if [ -n "$FONTS_DIR" ]; then
            mkdir -p cpp/fonts
            cp -R "$FONTS_DIR"/*.ttf cpp/fonts/
          fi
          for f in NotoSansSC-Regular.ttf NotoSansSC-Bold.ttf; do
            test -f "cpp/fonts/$f" || { echo "::error::cpp/fonts/$f missing: pass fonts_dir or preload it on the runner"; exit 1; }
          done

      - name: Build Skia from pinned commit
        shell: bash
        env:
          SKIA_WIN_VC: ${{ vars.SKIA_WIN_VC }}
          SKIA_WIN_SDK: ${{ vars.SKIA_WIN_SDK }}
          SKIA_WIN_SDK_VERSION: ${{ vars.SKIA_WIN_SDK_VERSION }}
          SKIA_CLANG_WIN: ${{ vars.SKIA_CLANG_WIN }}
          SKIA_CLANG_WIN_VERSION: ${{ vars.SKIA_CLANG_WIN_VERSION }}
          SKIA_WIN_TOOLCHAIN_VERSION: ${{ vars.SKIA_WIN_TOOLCHAIN_VERSION }}
        run: bash tools/skia/build-skia.sh --rev="$REV" --out="$PWD/cpp/skia" --replace

      # 自托管 runner 预装 PHP，但不保证有 composer；有就按 lock 装 PHPUnit。
      # ★ 这里**不**把 unit 当硬判据：本 workflow 的产物是 Skia 依赖包，只跑
      #   `verify --layer=static`（零依赖静态层），不启动 PHPUnit，也就没有
      #   「没测到被算通过」的形状。ci.yml / release.yml 才把 unit 当硬判据。
      #   裁剪结果不作验收报告，断言只验报告本身合法且 ok。
      - name: Install PHPUnit (pinned by composer.lock)
        shell: bash
        run: |
          if command -v composer >/dev/null 2>&1; then
            composer install --prefer-dist --no-progress
          else
            echo "::notice::composer unavailable on this runner; only the static layer runs"
          fi

      - name: Pack and verify
        shell: bash
        run: |
          set -o pipefail
          php tools/pack-deps.php
          php bin/drift verify --layer=static --json | tee verify-report.json
          php .github/scripts/assert-verify-report.php verify-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: drift-deps-${{ inputs.skia_revision }}
          path: |
            dist/drift-deps-win-x64.zip
            dist/drift-deps-win-x64.zip.sha256
            deps.lock.json
          retention-days: 14

      - name: Commit lock and push
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKIA_REVISION deps.lock.json
          if git diff --cached --quiet; then
            echo "::error::pack-deps produced no lock change; nothing to publish"
            exit 1
          fi
          git commit -m "chore(deps): rebuild Skia at ${REV:0:12} for $(tr -d '\r\n' < DEPS_VERSION)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Tag deps version
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          TAG="$(tr -d '\r\n' < DEPS_VERSION)"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publish deps release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: php tools/release-deps.php --token="$TOKEN"

      - name: Verify from published assets
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php tools/fetch-deps.php --tag="$(tr -d '\r\n' < DEPS_VERSION)" --force

      - name: Dry-run summary
        if: ${{ !inputs.publish }}
        shell: bash
        run: echo "Package built and verified; publish=false so no commit/tag/release was written. Inspect the artifact before re-running with publish=true."
