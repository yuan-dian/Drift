name: Verify

# 这里只跑判据，不写 Release。依赖通道在 windows-deps.yml（Skia pin 变更 / 手动），
# 真机构建在 windows-build.yml，产品发版在 release.yml（先依赖，再编译）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # 手动触发 gate-full（全量慢项）；不设定时任务

# 对齐上游 swoole/typephp（windows-build.yml / linux-x64.yml）的 CI 惯例：
# 最小权限、同 ref 取消旧跑、composer 非交互且不受子进程超时影响。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  # ── T0：纯 PHP 校验，公开 Windows runner 即可，无需 MSVC / tpc ──
  #
  # ★ 判据集**不写白名单**（2026-11-11）：此前是
  #     --only=lint,selftest,devshell,docref,apidoc,probe,tick,scale,sym,m2,unit
  #   —— 11 项 vs `gate` 真实 28 项，漏掉的是 abi / cppbridge / dxdiag /
  #   stalepolicy / errshape 这五个「接线对账 + 变异自证」对，共 10 项亚秒级纯 PHP
  #   判据。它们恰恰是最该进 CI 的类型（没有前置依赖、抓的是"能力是假的"）。
  #   根因是白名单不会随新增判据增长 ⇒ 改成跑全量廉价项。
  #   2026-11-12 起这 10 条在顶层收成 `tooling` 一组；2026-11-13 S4 起 V1 gate
  #   整体退役，判据集合自动跟随 `tests/Verify/VerifyPlan.php` 的 `fast` 层，
  #   CI 不再写任何判据白名单（`--list` 是唯一事实源）。
  gate-fast:
    name: Verify (T0 pure-PHP, PHP ${{ matrix.php }})
    # 上游把 Windows runner pin 到 2022 而不是 latest：latest 换镜像时 GD / PHP
    # 扩展版本会跟着变，判据基线不该被 runner 升级悄悄挪动。
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # `composer.json` 声明 `>=8.4`（无上界），而此前 CI 只在 8.4 上验、作者
      # 本机一直是 8.5.12 —— 两边从未在同一版本对过账。与上游 8.4/8.5 同口径。
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, gd
          tools: composer:v2
        env:
          fail-fast: true
          update: true
        # ★ 不借上游的 `phpts: ts`：那是编译 tpc 需要 ZTS PHP；本档是纯 PHP
        #   判据，用 ZTS 反而与本地开发环境不同口径。
      - name: Show PHP environment
        shell: bash
        run: |
          php -v
          php --ini
          php -r 'printf("PHP_VERSION=%s\nmbstring=%s\ngd=%s\n", PHP_VERSION, extension_loaded("mbstring") ? "yes" : "no", extension_loaded("gd") ? "yes" : "no");'
      - name: Verify PHP version and extensions
        shell: bash
        run: |
          case "$(php -r 'echo PHP_VERSION;')" in
            "${{ matrix.php }}"*) ;;
            *) echo "::error::setup-php installed an unexpected PHP version" >&2; exit 1 ;;
          esac
          php -r 'foreach (["mbstring", "gd"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing extension: $e\n"); exit(1); } }'
      # A54：tpc 全量编译 sources、没有死码消除，ignore 写漏一条不会报错，
      # 只会把审查面（查询 / 证据 / 协议 / 驱动）白扛进 AOT 产物。
      # 纯 PHP、亚秒级；自证在前，确认判据自身没退化再对账 8 个应用。
      - name: Debug scope gate
        shell: bash
        run: |
          php tools/check-debug-scope.php --selftest
          php tools/check-debug-scope.php
      # Web 调试页的前后端路由对账：死路由与断链都是"平时不报错、用时才炸"的那类。
      - name: Web route gate
        shell: bash
        run: |
          php tools/check-web-routes.php --selftest
          php tools/check-web-routes.php
      # ★ PHPUnit 二进制不入库（`/vendor/` 被 .gitignore 排除），CI 必须自己装。
      #   不装 ⇒ verify 的 unit / feature step 进程起不来（exitCode 127）、
      #   顶层 ok=false，绝不会伪装成"通过"（2026-11-12 查出的假绿）。
      #   读入库的 composer.lock（phpunit 10.5.66），与上游 swoole/typephp 的
      #   windows-build.yml 同法；不下载不 pin 版本的 phpunit-10.phar。
      - name: Install PHPUnit (pinned by composer.lock)
        shell: bash
        run: composer install --prefer-dist --no-progress
      - name: Run verify (fast items, CI matrix)
        shell: bash
        run: |
          set -o pipefail
          php bin/drift verify --json | tee verify-report.json
      - name: Assert workflow gates stay real
        shell: bash
        run: php .github/scripts/assert-workflows.php
      # verify 不像 V1 gate 那样把「没测到」算通过；这份断言再走独立路径
      # 读 items[].status，钉住 unit 确实跑到了（判据与 runner 不同源）。
      - name: Assert PHPUnit really ran (not measured is not ok)
        shell: bash
        run: php .github/scripts/assert-verify-report.php verify-report.json unit
      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ matrix.php }}
          path: verify-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ── 手动全量：T0 全量（含 feature / pages / smoke 慢项），仍纯 PHP ──
  #    不设定时：提交构建是主闸门，全量档按需手动触发；发版 tag 由 release.yml 自动跑。
  #    题库全量对照是 --layer=corpus 的独立量具，不在这个 runner 的报告里。
  gate-full:
    name: Gate (full, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, gd
          tools: composer:v2
        env:
          fail-fast: true
          update: true
      # 慢项只在 8.4 上跑一遍：matrix 的价值是给日常 fast 档做版本对账，
      # 全量 feature / pages / smoke 翻倍没有新信息，只多占 runner。
      - name: Install PHPUnit (pinned by composer.lock)
        shell: bash
        run: composer install --prefer-dist --no-progress
      - name: Run verify (full)
        shell: bash
        run: |
          set -o pipefail
          php bin/drift verify --full --json | tee verify-report.json
      - name: Assert full gate really ran (unit / feature)
        shell: bash
        run: php .github/scripts/assert-verify-report.php verify-report.json unit feature
      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-full
          path: verify-report.json
          if-no-files-found: ignore
          retention-days: 7

  # ── T2：真 AOT 在 windows-build.yml 的独立 job 里跑 ──
  # 公开 windows-2022 runner 从源码构建 tpc / PHPX，取依赖包，全量编译 hello，
  # 再执行 probe-window 五判据。这里不再留 `if: false` 的占位 job —— 死 job
  # 会让人误以为 AOT 已在 CI 里。gate-fast 的结构判据守着那条通道不退化。
