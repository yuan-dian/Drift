name: 能力建议
description: 提议新的框架能力或改进
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前先看裁决索引，现行结论带失效条件，避免重复已否决的方向。
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 具体场景，不是"最好有 X"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: API 形态或实现方向；不确定就写候选
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 成熟 GUI 框架（Flutter / Avalonia / Slint / Tauri 等）怎么解，为什么不适合本仓
  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认
      options:
        - label: 已知本仓是 Windows-only、API 未稳定的技术预览
          required: true
        - label: 已查过裁决索引，此方向未被否决或已满足失效条件
          required: false
