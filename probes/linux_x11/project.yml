# ═══════════════════════════════════════════════════════════════════════════
# probes/linux_x11/project.yml —— Linux 门专用工程（与 Windows 的 build/base.yml 对等）
# ═══════════════════════════════════════════════════════════════════════════
#
# ★ 为什么要独立一份：Windows 的 `apps/*/project.yml` include `build/base.yml`
#   （MSVC / Skia / win32 编译参数），与 Linux/GCC 不兼容。官方 qt-taskboard 示例
#   也是每个平台一份 project 文件：sources 共用，差异只在 flags/libs。
#
# ★ 路径基准：build.sh 把本文件连同 app/ native/ src/ 复制到隔离工作区 $ws，
#   再 `cd $ws && tpc project.yml`，所以这里所有 sources 路径相对 $ws。
#   `-Llib` 里的 libX11.so 软链由 build.sh 现场建立；`native/` 只放 X11 桥
#   （build.sh 现场复制），所以不会与 win32 stub 混编。

name: linux_x11_e2e
version: 0.1.0
info:
  Author: Drift
  Description: X11Platform end-to-end gate
mode: bin
cxx-std: c++20
job: 4

ld-flags:
  - -Llib
  - -lX11

sources:
  - app
  - native
  - src
