# ═══════════════════════════════════════════════════════════════════════════
# apps/watermark/project.yml —— 第一个**真实业务闭环**（复刻 原参考实现）
# ═══════════════════════════════════════════════════════════════════════════
#
# ★★ 调用约定与 `apps/users/project.yml` 逐条相同（**从仓库根调用**；被 tpc 解析的
#   路径以本文件所在目录为基准 ⇒ 写 `../../` 前缀）。
#
# ★ 本应用的定位与 `apps/showcase` / `apps/users` 不同：那两个是**能力目录**，
#   这个是**一条业务链**（选图 → 传 OSS → 建任务 → 轮询 → 出图）。它存在的理由
#   是把散落的框架能力拼起来验一次"能不能用"，而不是再列一遍控件。

name: watermark
version: 0.1.0

resource:
  version-info:
    internal-name: watermark
    original-filename: watermark.exe
    file-version: 0.1.0
    product-version: 0.1.0
    file-description: AI 图片处理工具

info:
  Author: Drift
  Description: 真实业务闭环 —— OSS 直传 + 异步任务 + 结果轮询（复刻 原参考实现）

include: ../../build/base.yml

sources:
  - .
  - ../../src
  - ../../cpp-src

# ★ `tests/` 必须排除（理由同 `apps/users/project.yml`：夹具要写顶层 `return`，
#   AOT 编译器的判据里没有 `Stmt_Return`）。
# ★ **`ignore` 要写全** —— tpc 的 list 型项是**整体替换**（不是追加），
#   只写 `[tests]` 会把 base 的 `build` 顶掉 ⇒ `Duplicate function main`。
ignore:
  - build
  - tests
