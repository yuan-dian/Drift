<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drift 证据</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="bar">
  <strong id="label">…</strong>
  <span id="window" class="dim"></span>
  <span id="state" class="chip"></span>
  <span id="inspectorLayers" class="chip" hidden></span>
  <span id="protocol" class="dim" title="调试协议版本；老宿主没有能力发现">协议 …</span>
  <span class="spacer"></span>
  <span id="ctl" class="ctl" hidden>
    <button data-act="pause">暂停</button>
    <button data-act="step">单步</button>
    <button data-act="resume">继续</button>
    <button id="pickbtn" data-act="pick" title="布防后到真窗口点一下控件；再点一次或 Esc 撤防">拾取</button>
  </span>
  <button id="refresh">刷新</button>
</header>

<main>
  <section id="findings">
    <h2>发现 <span id="findingCount" class="dim"></span></h2>
    <ol id="findingList"></ol>
    <p id="coverage" class="dim small" hidden></p>
    <details id="evidence">
      <summary>证据口径</summary>
      <div class="meta"><span>指纹</span><span id="digest" class="mono"></span></div>
      <div class="meta"><span>阈值</span><span id="thresholds"></span></div>
      <div class="meta"><span>规则</span><span id="ruleInfo"></span></div>
      <div class="meta"><span>窗口</span><span id="windowMeta"></span></div>
    </details>
    <h2>搜索</h2>
    <input id="q" type="search" placeholder="节点 / 请求 / 文本，回车" autocomplete="off">
    <ol id="hitList" class="hits"></ol>
  </section>

  <section id="stage">
    <!-- 画面：底图是真机像素，上面叠几何。两层共用同一个矩形（left/top/width/height
         由 app.js 按 scale/offset 写成像素），所以框永远压在图上的同一个位置。 -->
    <div id="viewport">
      <img id="shot" alt="" draggable="false">
      <canvas id="canvas"></canvas>
      <div id="noshot" hidden><span id="noshotWhy">这一帧没有画面</span><span id="noshotHow" class="small"></span></div>
    </div>
    <div id="toolbar">
      <button id="fit" title="缩放至适应窗口（快捷键 0）">适应</button>
      <button id="actual" title="1:1 真机像素（快捷键 1）">1:1</button>
      <button id="follow" class="on" title="跟着应用最新画面走（快捷键 F）">跟随</button>
      <span id="zoom" class="mono dim">100%</span>
      <span id="viewsize" class="mono dim small"></span>
      <span class="sep"></span>
      <span id="hint" class="dim small"></span>
      <span class="spacer"></span>
      <span id="shotinfo" class="mono dim small"></span>
    </div>
    <details id="framestrip" open>
      <summary>帧时间轴 <span id="frameCount" class="dim"></span></summary>
      <div id="axis">
        <div id="frameList"></div>
        <div id="netlane"></div>
        <div id="joblane"></div>
      </div>
      <p id="netscope" class="dim small">仅统计经 Drift HTTP 客户端的请求 · 每格一帧，静止空帧已折叠</p>
      <p id="asyncscope" class="dim small">异步泳道只列后端调度过的任务 · await / sleep 不是 job</p>
    </details>
  </section>

  <section id="side">
    <details id="treePanel" open>
      <summary>结构树 <span id="treeCount" class="dim"></span></summary>
      <div id="tree"></div>
      <p id="treescope" class="dim small"></p>
    </details>
    <details id="diffPanel">
      <summary>两帧对比 <span id="diffCount" class="dim"></span></summary>
      <div class="small">
        <label>从 <input id="diffBase" type="number" min="0" value="0" style="width:5em"></label>
        到 <span id="diffTo" class="mono">最新</span>
        <button id="diffRun" type="button">对比</button>
      </div>
      <p id="diffscope" class="dim small"></p>
      <div id="diff"></div>
    </details>
    <h2>节点 <span id="selected" class="mono"></span> <span id="selSource" class="dim small"></span></h2>
    <div id="crumbs" class="small"></div>
    <div id="children" class="small"></div>
    <div id="card"></div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
