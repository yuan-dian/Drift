# ═══════════════════════════════════════════════════════════════════════════
# build/base.yml —— 两个应用**共享**的编译参数（§4.6）
# ═══════════════════════════════════════════════════════════════════════════
#
# ★ 何时抽的：`apps/hello` 的 project.yml 早就写明"第二个应用（`apps/users`）
#   落地时再抽，那时才知道哪些项真的共享"—— 本文件就是那一刻的产物（2026-10-16）。
#
# ★ 两条 tpc 语义（读 `typephp/src/Config/ProjectYamlLoader.php` 核实过）：
#   ① `include:` 里的路径相对**被包含文件所在目录**解析；这里相对本文件（`build/`）⇒
#      凡 tpc 解析的路径（`build-dir` 一类）都要按 `build/` 起算；
#   ② **list 型项是整体替换，不是追加** ⇒ 只有"两边完全相同"的 list 才配放这里。
#      `sources` 因此**留在各应用文件里**（它含各应用自己的相对路径）。
#
# ★ 这里**不链 Skia**：`cxx-std: c++17` 是有意的 —— M1 走 PHP 软光栅 +
#   `SetDIBitsToDevice`（§7.3），Skia 后端（`SkiaCanvas`，M4+）落地时这里才升 `c++20`
#   （SkParagraph 的私有头用了 `std::countl_zero`，C++20 起才有）。
#
# ───────────────────────────────────────────────────────────────────────────
# ★★ Skia 追加项（M4 落地 `SkiaCanvas` 时抄这段；**2026-10-16 照
#    `D:\TypePHP\GUI\apps\demo\project.yml` 逐条核过**，那是真机构建通过的配置）:
#
#   前提：把 Skia 预编译包放到 `Drift2/cpp/skia/`（GUI 的那份在 `GUI/cpp/skia/`：
#         `include/` + `out/Release-x64/*.lib`）。
#
#   cxx-std: c++20                      # ★ 必须 —— SkParagraph 的 src/base/SkMathPriv.h
#                                       #   用 std::countl_zero/countr_zero（<bit>），C++17 报 C2039
#   cxx-flags 追加:
#     - /MT                             # 匹配 Px-dev 的 Skia 预编译包（aseprite m151，静态 CRT）。
#                                       #   ★ bin(AOT) 模式不链 php8ts.lib ⇒ /MT 安全；
#                                       #   litehtml-lab 走 /MD（php8ts）曾撞 LNK2038，别混
#     - /DUSE_SKIA                      # 打开桥里的 Skia 分支（否则退化 GDI 路径）
#     - /I"cpp/skia"                    # 让 #include <core/SkCanvas.h> 命中预编译 include 根
#                                       #   ★ 相对 **cwd（仓库根）** —— cxx-flags 不过 tpc 的路径解析
#     - /DGR_GL_FUNCTION_TYPE=__stdcall
#   ld-flags 追加（**按依赖顺序，依赖者在前** —— 顺序错了就是一堆 LNK2019）:
#     - cpp/skia/out/Release-x64/skia.lib  ·  skunicode_icu  ·  icu  ·  skcms  ·  expat
#     - freetype2  ·  harfbuzz  ·  libpng  ·  zlib  ·  libjpeg  ·  libwebp  ·  sksg
#     - skshaper  ·  skresources  ·  skparagraph  ·  skunicode_core  ·  skottie
#     - svg  ·  wuffs  ·  bentleyottmann  ·  jsonreader          （皆 .lib，同目录）
#   link-libs 追加: d3d12.lib · dxgi.lib · d3dcompiler.lib · windowscodecs.lib
#
#   ★ 另有一件 GUI 做了、Drift2 还没做的事：`resource:`（图标 + 版本信息）与
#     `manifest:`（comctl32 v6 —— 没有它，**原生** MessageBox 是 Win95 外观）。
#     Drift2 的 `Errors::installFatalBox` 正是用 `MessageBoxW` ⇒ M4 起 exe 时应一起加。
# ───────────────────────────────────────────────────────────────────────────

mode: bin
platform: win32

# 隐藏控制台黑框：tpc 会加 /SUBSYSTEM:WINDOWS **并自动补 /ENTRY:mainCRTStartup**
# （后者是关键 —— 否则 CRT 找不到入口）。代价：无 stdout/stderr，诊断一律走
# `Errors` 的日志文件（§1.2 中止序列第 ① 步本来就是写日志）。
no-console: true

cxx-std: c++17

cxx-flags:
  # 桥接源码（cpp-src/drift_win32.cc）的注释与字符串是 UTF-8。不加这条，
  # MSVC 会按系统代码页解析 ⇒ 中文注释直接报 C4819 或静默乱码。
  - /utf-8
  # size_t → int 的窄化：Skia/系统头里大量存在，本工程自己的代码没有。
  - /wd4267
  # 多进程共享 PDB 写句柄（与 GUI 仓一致；并行编译时必需）
  - /FS

ld-flags:
  # AOT 转译后 PHP 函数栈帧远大于 Zend VM 虚拟栈 ⇒ 默认 1MB 链接栈会在深调用链
  # 上溢出崩溃。8MB 与 GUI 仓 / markdown-editor 一致。
  - /STACK:8388608

# Windows 系统库（只列**真的用到**的；桥里每个 API 都能对上一本库）：
#   user32   建窗 / 消息泵 / 定时器 / 光标 / 按键状态 / 消息框 / DPI
#   gdi32    SetDIBitsToDevice（贴一帧像素，§7.3 M1 的位块传送）
#   advapi32 注册表读 AppsUseLightTheme（§9.2 的系统深色模式）
link-libs:
  - user32.lib
  - gdi32.lib
  - advapi32.lib

# 构建产物不能进 sources —— 生成的 .cc 会被当成源码再翻译一遍，
# 症状是 "Duplicate function main" 这类看不出根因的错误。
ignore:
  - build

build-dir: build
