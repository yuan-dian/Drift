# ═══════════════════════════════════════════════════════════════════════════
# build/base.yml —— 两个应用**共享**的编译参数（§4.6）
# ═══════════════════════════════════════════════════════════════════════════
#
# ★ 何时抽的：`apps/hello` 的 project.yml 早就写明"第二个应用（`apps/users`）
#   落地时再抽，那时才知道哪些项真的共享"—— 本文件就是那一刻的产物（2026-10-16）。
#
# ★ 两条 tpc 语义（读 `typephp/src/Config/ProjectYamlLoader.php` 核实过）：
#   ① `include:` 里的路径相对**被包含文件所在目录**解析；这里相对本文件（`build/`）⇒
#      凡 tpc 解析的路径（`build-dir` 一类）都要按 `build/` 起算；
#   ② **list 型项是整体替换，不是追加** ⇒ 只有"两边完全相同"的 list 才配放这里。
#      `sources` 因此**留在各应用文件里**（它含各应用自己的相对路径）。
#
# ★ **这里链 Skia**（2026-10-16 起，`SkiaCanvas` 落地）：`cxx-std: c++20` 是必需的 ——
#   每个应用都链 `skia.lib`，而 Skia 的私有头用 `std::countl_zero/countr_zero`
#   （`<bit>`，C++20 起才有）⇒ C++17 报 C2039。
#
# ───────────────────────────────────────────────────────────────────────────
# ★★ Skia 链接项（**已生效**；依据见 `SKIA-BUILD.md` 的实测报告）
#
#   包在 `Drift2/cpp/skia/`（`include/` + `modules/` + `src/` + `out/Release-x64/*.lib`，
#   约 **141 MB** ⇒ **不入库**，见 `.gitignore` 与 `DESIGN.md §24.2 #12`）；
#   字体在 `Drift2/cpp/fonts/`（Noto Sans SC，OFL）。**exe 必须以仓库根为 cwd 启动**
#   —— 两者都按相对路径查找。
#
#   · `/MT` —— 匹配预编译包的**静态 CRT**。★ 它**能加**（实测构建通过）：
#     tpc 的 `/MD` 写在 cxxflags **之前**（`Msvc.php:104`），用户 flag 在之后追加
#     ⇒ 这里的 `/MT` 覆盖它；且 php8ts 在本环境是 **DLL** ⇒ 跨 DLL 边界不共享 CRT
#     ⇒ "静态库里 /MT 致命"那条**不适用**。
#     ★ 但它**换不到"免 CRT / 单文件"** —— exe 仍导入 `VCRUNTIME140.dll`
#     （php8ts.dll 是 /MD）⇒ **别为省体积加它**，加它只是为了匹配 Skia 包。
#   ★ **没有 `/DUSE_SKIA`** —— 上游参考仓的桥有 `#ifdef USE_SKIA` 的 GDI 回退分支，
#     我们没有移植那个分支 ⇒ 这个 define **零消费者**（本仓代码与 Skia 头都不用，已核）
#     ⇒ 按"不预挂"删掉。真要做条件编译时再加，并同时给出消费者。
#   · `/I"cpp/skia"` —— **唯一需要的 include 根**：包内头按 `include/core/...` 与
#     `modules/skparagraph/...` 两种前缀写，一个 -I 同时覆盖两者（`SkColorSpace.h`
#     会 `#include "modules/skcms/skcms.h"` ⇒ 不能只给 `.../include`）。
#     ★ 相对 **cwd（仓库根）** —— cxx-flags 不过 tpc 的路径解析（`drift-build` 的 cwd 就是仓库根）
#   · `/DGR_GL_FUNCTION_TYPE=__stdcall` —— Skia 的 GL 函数指针约定
#
#   `ld-flags` 里的 Skia 库**按依赖顺序**（依赖者在前；顺序错了就是一堆 LNK2019）。
#   ★ **不含 `skottie`** —— 该包 Skottie 头不完整（`SlotManager.h` 要私头
#     `modules/skottie/src/SkottieValue.h`）⇒ **实际不可用**，列进清单是空转（实测 C1083）。
#   ★ **不含 `skshaper` / `skparagraph` / `skunicode_*` / `icu`** —— M1 的 `SkiaCanvas`
#     不做文本塑形（几何来自 PHP 的 `Paragraph`，Skia 只把字形画出来）⇒ **不链 ICU、
#     也就不需要 `icudtl.dat`**。真字体重排版（`SkiaTextMetricsProvider`，M4）落地时
#     再加回，那时要补 `advapi32.lib`（ICU 时区探测）并把 `icudtl.dat` 放到 exe 工作目录
#     （ICU 按 **cwd** 找；缺失即 `check(fUnicode)` abort）。
#
#   ★ 体积（最小程序 `/O2 /MT` **实测**，非"库文件大小"）：core 光栅 **4.03 MiB**
#     → +文本栈（SkParagraph/SkShaper/HarfBuzz/ICU）**5.89 MiB**（+1.86）
#     → +SVG/SkSG/expat **6.41 MiB**（+0.52）。对照 Drift2 `users.exe`（无 Skia）2.90 MiB。
#
#   ★ `resource:` 的**图标已接**（见文件末尾）；版本信息与 `manifest:`
#     （comctl32 v6 —— 没有它，**原生** MessageBox 是 Win95 外观）仍未接。
#     Drift2 的 `Errors::installFatalBox` 正是用 `MessageBoxW` ⇒ 接 manifest 时
#     要一起验原生框的外观。
#     ★ **DPI 感知不在 manifest 的清单里**：它在**运行期**由 `drift_win_create()` 用
#       `SetProcessDpiAwarenessContext(PER_MONITOR_AWARE_V2)` 设定（§24.1 #43）。
#       走 manifest 也能做，但当前实现选了运行期 ⇒ 加 `manifest:` 时**不要**再写一份
#       `dpiAwareness`（两边都写以 manifest 为准，会盖掉框架的选择且难排查）。
# ───────────────────────────────────────────────────────────────────────────

mode: bin
platform: win32

# 隐藏控制台黑框：tpc 会加 /SUBSYSTEM:WINDOWS **并自动补 /ENTRY:mainCRTStartup**
# （后者是关键 —— 否则 CRT 找不到入口）。代价：无 stdout/stderr，诊断一律走
# `Errors` 的日志文件（§1.2 中止序列第 ① 步本来就是写日志）。
no-console: true
job: 16

cxx-std: c++20

cxx-flags:
  # 桥接源码（cpp-src/drift_win32.cc）的注释与字符串是 UTF-8。不加这条，
  # MSVC 会按系统代码页解析 ⇒ 中文注释直接报 C4819 或静默乱码。
  - /utf-8
  # size_t → int 的窄化：Skia/系统头里大量存在，本工程自己的代码没有。
  - /wd4267
  # 多进程共享 PDB 写句柄（与 GUI 仓一致；并行编译时必需）
  - /FS
  # ── Skia（见文件头 ★★ Skia 链接项）──
  # /MT 匹配预编译包的静态 CRT；它**能加**是因为 tpc 的 /MD 写在 cxxflags 之前
  # （用户 flag 在之后追加 ⇒ 覆盖它），且 php8ts 是 DLL ⇒ 跨 DLL 边界不共享 CRT。
  # ★ 它**换不到"免 CRT / 单文件"**（exe 仍导入 VCRUNTIME140.dll）⇒ 别为省体积加它。
  - /MT
  # 相对 **cwd（仓库根）**：cxx-flags 不过 tpc 的路径解析
  - /I"cpp/skia"
  - /DGR_GL_FUNCTION_TYPE=__stdcall

ld-flags:
  # AOT 转译后 PHP 函数栈帧远大于 Zend VM 虚拟栈 ⇒ 默认 1MB 链接栈会在深调用链
  # 上溢出崩溃。8MB 与 GUI 仓 / markdown-editor 一致。
  - /STACK:8388608
  # ★ `/MAP`（2026-11-02）：真机崩溃只能拿到"模块+RVA"（见 `cpp-src/win32/crash_report.h`），
  #   没有符号表就无从知道那个 RVA 是哪个函数。map 是**纯文本、链接期顺手生成**，
  #   比 pdb（要 /DEBUG + /Zi，会拖慢构建并让 exe 变大）划算得多。
  #   ★ 落盘位置是**链接器 cwd**（= 仓库根，与 exe 同目录），名字 = 输出名 + `.map`。
  #   它和 exe 一样是构建产物 ⇒ `*.map` 已在 `.gitignore`。
  - /MAP
  # ── Skia（**按依赖顺序，依赖者在前** —— 顺序错了就是一堆 LNK2019）──
  # ★ 不含 skottie（头不完整、不可用）/ skshaper / skparagraph / skunicode_* / icu：
  #   M1 的 SkiaCanvas 不做文本塑形 ⇒ 不链 ICU、也就不需要 icudtl.dat。
  #   未用的 .lib **不会被链接器加载**，所以这里只列真的会被引用的那些。
  - cpp/skia/out/Release-x64/skia.lib
  - cpp/skia/out/Release-x64/skcms.lib
  - cpp/skia/out/Release-x64/expat.lib
  - cpp/skia/out/Release-x64/freetype2.lib
  - cpp/skia/out/Release-x64/harfbuzz.lib
  - cpp/skia/out/Release-x64/libpng.lib
  - cpp/skia/out/Release-x64/zlib.lib
  - cpp/skia/out/Release-x64/libjpeg.lib
  - cpp/skia/out/Release-x64/libwebp.lib
  - cpp/skia/out/Release-x64/wuffs.lib
  - cpp/skia/out/Release-x64/bentleyottmann.lib
  - cpp/skia/out/Release-x64/jsonreader.lib

  # Windows 系统库（只列**真的用到**的；桥里每个 API 都能对上一本库）：
  #   user32   建窗 / 消息泵 / 定时器 / 光标 / 按键状态 / 消息框 / DPI
  #   gdi32    SetDIBitsToDevice（贴一帧像素，§7.3 M1 的位块传送）
  #   advapi32 注册表读 AppsUseLightTheme（§9.2 的系统深色模式）
  #   shell32   SHGetKnownFolderPath —— 用户配置目录（§5.4 `WindowStateStore`）
  #   imm32     IME 组合串
  #   —— 以下为 Skia 需要（`skia.lib` 的 D3D 后端 / 图片编解码 / 系统字体枚举）：
  #   d3d12 / dxgi / d3dcompiler   Skia 的 D3D12 后端（当前走 CPU 光栅，但归档里有引用）
  #   windowscodecs                图片编解码（WIC）
  #   opengl32 / msimg32           Skia 的 GL 兜底路径与 GDI 混合
  #   dwrite / gdiplus             系统字体枚举 / GDI+ 路径
  #   ole32                        COM 初始化（WIC / DirectWrite 的底座，
  #                               `SHGetKnownFolderPath` 返回值的 `CoTaskMemFree`）
link-libs:
  - user32.lib
  - gdi32.lib
  - advapi32.lib
  - shell32.lib
  - imm32.lib
  - d3d12.lib
  - dxgi.lib
  - d3dcompiler.lib
  - windowscodecs.lib
  - opengl32.lib
  - msimg32.lib
  - dwrite.lib
  - gdiplus.lib
  - ole32.lib

# 构建产物不能进 sources —— 生成的 .cc 会被当成源码再翻译一遍，
# 症状是 "Duplicate function main" 这类看不出根因的错误。
ignore:
  - build

build-dir: build

# ───────────────────────────────────────────────────────────────────────────
# 品牌图标（`resource:`）—— 2026-10-26
#
# ★ 一处配置、四个应用全生效：`include` 的合并是**递归**的
#   （`ProjectYamlLoader::mergeConfig` 对非 list 的嵌套 map 递归合并），所以各
#   应用的 project.yml 只管自己独有的项（name / 版本 / sources），resource 留这里。
#
# ★ 路径基准是**各应用 project.yml 所在的目录**，不是本文件目录 —— tpc 把
#   `resource.icon` 直接拼在 projectDir 后面（`Translator.php:4814`）。所有
#   include 本文件的应用都在 `apps/<name>/` 同一深度 ⇒ `../../assets/...` 对
#   全部成立。★ 写错不会静默：编译期报 `Icon file not exists`。
#
# ★ 资源 ID 由 tpc 写死为 `MAINICON` = **101**
#   （`ResourceFileGenerator::generateHeader`）。壳侧 `drift_win_create()` 按
#   101 取图标、取不到回落系统默认 —— 两头是同一个约定，换 tpc 时那边要跟着改。
#
# ★ `version-info` 只放**四个应用完全相同**的字段，应用独有的四项下沉到各自的
#   project.yml（见下方分段注释）—— tpc 不支持变量插值，这是能做到的最小重复。
resource:
  icon: ../../assets/Drift-app-icon.ico

  # ── 版本信息（PE 属性页）──────────────────────────────────────────────
  # ★ 放这里的都是**四个应用完全相同**的三项；应用独有的四项
  #   （internal-name / original-filename / file-description / file-version）
  #   写在各自 project.yml 里，靠递归合并拼起来。
  # ★ tpc **不支持 yml 变量插值**（核过 `ProjectYamlLoader`：没有任何 `${}`
  #   处理）⇒ `product-name: ${name}` 这种写法无效，重复消不掉，只能靠"放得
  #   近 + 注释"约束。
  # ★ `file-version` 与 app 的 `version:` 是**两处真相**：改版本时两处都要改。
  #   漏改的症状是"属性页版本没变"——不报错、只是看着不对。各 app 里我把
  #   resource 段紧挨着 `version:` 放，扫一眼就能看见。
  # ★ `product-version` **不能省**：tpc 的数字 `PRODUCTVERSION` 会落回
  #   file-version，但 StringFileInfo 里只在 `isset` 时才写这一项 ⇒ 省掉的话
  #   属性页"产品版本"显示**空白**（PowerShell 读到 ProductVersion 为空字符串）。
  #   两行写同一值，是 Windows 惯例（FileVersion 与 ProductVersion 通常一致）。
  # ★ `file-os` / `file-type` / `file-flags` 也不写：tpc 的默认值就是
  #   VOS_NT_WINDOWS32 / VFT_APP / 0x0L，正好是我们想要的。
  version-info:
    company-name: Drift
    product-name: Drift
    legal-copyright: Copyright (C) 2026 Drift

# ───────────────────────────────────────────────────────────────────────────
# 应用清单 —— comctl32 v6，让进程**激活视觉样式**
#
# 影响面只有系统绘制的窗口（原生 MessageBox / IME 候选窗）：没有它，
# `Errors::installFatalBox()` 的 MessageBoxW 是 Win95 外观。Drift2 自己的界面
# 全部自绘，不受影响。
#
# ★★ 清单里**不要**写 dpiAwareness —— DPI 感知是运行期由 `drift_win_create()`
#   设 PER_MONITOR_AWARE_V2 的（§24.1 #43）。两边都写以 manifest 为准，会悄悄
#   盖掉框架的选择（症状：跨屏变糊、收不到 WM_DPICHANGED）。`build/app.manifest`
#   的文件头重复了这条警告，`tools/probe-window.py` 判据 ④ 守着它。
# ★ 路径基准与 resource 相同（各应用 project.yml 目录）⇒ ../.. 对全部成立。
manifest: ../../build/app.manifest
